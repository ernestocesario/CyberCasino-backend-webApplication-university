<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="/profile/style.css">
</head>
<body>
<a class="navbar-brand logo-btn" href="http://localhost:4200">
    <img src="../images/3-1.png" alt="Logo" style="max-height: 40px; margin-top: 15px; margin-left: 15px;">
</a>
<div class="container-fluid">
    <div class="col-lg-12 mb-4">
        <div class="card bg-secondary shadow">
            <div class="card-header bg-white border-0">
                <div class="col-8">
                    <h1 class="mb-0">My Profile</h1>
                </div>
            </div>
            <div class="card-body">
                <form>
                    <div class="half-container">
                        <h2 class="heading-small text-muted mb-4">User information</h2>
                        <div class="pl-lg-4">
                            <div class="row">
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <label class="form-control-label" for="input-username">Username</label>
                                        <input type="text" id="input-username" class="form-control form-control-alternative" th:value="${username}" readonly>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <label class="form-control-label" for="input-email">Email address</label>
                                        <input type="email" id="input-email" class="form-control form-control-alternative" th:value="${email}" readonly>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
                <hr class="my-4" />
            </div>
        </div>
    </div>
    <div class="container-balance">
        <div class="row">
            <!-- Aggiungi i bottoni e la label -->
            <div class="half-container">
                <label id="balanceText" class="middle-color">Balance: </label>
                <div class="green-highlighted">
                    <label id="balanceValue" class="light-color bold" th:text="${balance}"></label>
                    <label class="light-color bold"> €</label>
                </div>
            </div>
            <div class="half-container">
                <button id="btnPreleva" class="button green-button bold btn-balance">Withdraw</button>
                <button id="btnDeposita" class="button blue-button bold btn-balance">Deposit</button>
            </div>
        </div>
    </div>
    <div class="container-transactions">
        <div class="row">
            <div class="col-lg-12">
                <div class="card bg-secondary shadow">
                    <div class="card-header bg-white border-0">
                        <div class="row align-items-center">
                            <div class="col-8">
                                <h3 class="mb-0">My Transactions</h3>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table>
                                <thead>
                                <tr>
                                    <th>User</th>
                                    <th>Amount</th>
                                    <th>Transaction Type</th>
                                </tr>
                                </thead>
                                <tbody>
                                <!-- Utilizza Thymeleaf per iterare attraverso la lista di transazioni -->
                                <tr th:each="transaction : ${latestTransactions}">
                                    <td th:text="${transaction.username}"></td>
                                    <td th:text="${transaction.amount}"></td>
                                    <td th:text="${transaction.transactionType}"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="table-responsive">
                            <h2>Latest Matches</h2>
                            <table class="table">
                                <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Game</th>
                                    <th>Amount</th>
                                </tr>
                                </thead>
                                <tbody>
                                <!-- Utilizza Thymeleaf per iterare attraverso la lista di match -->
                                <tr th:each="match : ${latestMatches}">
                                    <td th:text="${match.username}"></td>
                                    <td th:text="${match.game}"></td>
                                    <td th:text="${match.amount}"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.getElementById('btnPreleva').addEventListener('click', function () {
        openPopup('/creditCard/creditCard.html?operationType=preleva');
    });

    document.getElementById('btnDeposita').addEventListener('click', function () {
        openPopup('/creditCard/creditCard.html?operationType=deposita');
    });

    function openPopup(url) {
        const urlParams = new URLSearchParams(window.location.search);
        token = urlParams.get('token');
        window.open(url+"&token="+token, '_blank', 'width=600,height=600,scrollbars=yes');
    }
</script>
<script type="module" src="/js/gameService.js"></script>
<script type="module" src="/profile/profile.js"></script>
</body>
