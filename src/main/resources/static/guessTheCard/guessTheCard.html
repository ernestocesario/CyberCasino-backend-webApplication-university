<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>Guess The Card</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<!-- partial:index.partial.html -->
<div id="app">
  <a class ="home-btn" style="position: absolute" href="http://localhost:4200">
    <img src="../images/3-1.png" alt="Logo" style="max-height: 40px;">
  </a>
  <audio src="sounds/FlipCard.mp3" id="flipCardSound"></audio>
  <audio src="sounds/WinSound.mp3" id="winSound"></audio>
  <audio src="sounds/LoseSound.mp3" id="loseSound"></audio>
  <audio src="sounds/ShuffleCards.mp3" id="shuffleCardsSound" muted="true"></audio>
  <audio src="sounds/RestartSound.mp3" id="restartSound" muted="true"></audio>

  <div id="bet">
    <p class="special-paragraphSaldo">CURRENT BALANCE: <span id="funds">{{funds}}</span></p>
    <label class="bet-label">BET AMOUNT: (€)</label>
    <input class="bet-input" type="number" id="amount" value="1"><!-- Add type and default value -->
  </div>
  <div class="control">
    <h1>{{state}}</h1>
  </div>
  <!-- Usa la direttiva v-if per visualizzare il pulsante solo se il gioco non è ancora iniziato -->
  <div class="cards" :class="{gather: gather}">
    <div class="card" v-for="card in cards" :class="{open: card.open}" :data-order="card.id" @click="openCard(card)">
      <div class="face back"> </div>
      <div class="face front">{{ getSymbol(card.label) }}</div>
    </div>
  </div>
</div>
<!-- partial -->
  <script type="module" src="guessTheCard.js"></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/vue/2.5.17-beta.0/vue.js'></script>
</body>

</html>
