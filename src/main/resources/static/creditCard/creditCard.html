<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Details</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="../js/profileService.js"></script>
</head>
<body>

<div class="card-form">
    <h2>Card Details</h2>
    <div class="form-group">
        <label for="cardNumber">Card Number:</label>
        <input type="text" id="cardNumber" placeholder="Enter your card number">
    </div>
    <div class="form-group">
        <label for="cardHolder">Card Owner:</label>
        <input type="text" id="cardHolder" placeholder="Enter the card owner">
    </div>
    <div class="form-group">
        <label for="expiryDate">Card Expiry:</label>
        <input type="text" id="expiryDate" placeholder="MM/YYYY">
    </div>
    <div class="form-group">
        <label for="cvv">CVV:</label>
        <input type="text" id="cvv" placeholder="Enter the CVV">
    </div>
    <div class="form-group">
        <label for="amount">Amount:</label>
        <input type="number" id="amount" placeholder="Enter the amount to deposit/withdraw">
    </div>
    <button id="confirmButton">Confirm</button>
</div>

<script type="module" src="creditCard.js"></script>

</body>
</html>
